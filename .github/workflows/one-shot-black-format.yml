name: One-shot backend Black normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-black-format.yml'

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize backend with Black
        run: black backend

      - name: Verify Black is clean
        run: black --check backend

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: pytest --cov=app --cov-report=xml --cov-fail-under=90

      - name: Commit validated formatting
        shell: bash
        run: |
          if git diff --quiet -- backend; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: normalize backend with Black"
          git push origin HEAD:main
