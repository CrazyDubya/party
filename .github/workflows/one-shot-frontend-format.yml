name: One-shot frontend normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-frontend-format.yml'

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Normalize frontend with Prettier
        working-directory: ./frontend
        run: npm run format

      - name: Verify frontend formatting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Commit validated frontend source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u frontend
          git diff --cached --check
          git commit -m "style: normalize frontend formatting"
          git push origin HEAD:main
