name: One-shot dependency cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-dependency-cleanup.yml'

permissions:
  contents: write

jobs:
  audit-fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Record audit baseline
        working-directory: ./frontend
        shell: bash
        run: |
          npm audit --json > /tmp/audit-before.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          console.log('audit-before', JSON.stringify(a.metadata?.vulnerabilities || {}));
          NODE

      - name: Apply non-breaking npm audit fixes
        working-directory: ./frontend
        run: npm audit fix

      - name: Record remaining audit findings
        working-directory: ./frontend
        shell: bash
        run: |
          npm audit --json > /tmp/audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
          console.log('audit-after', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            if (['critical', 'high'].includes(v.severity)) {
              console.log('remaining-high', name, JSON.stringify({severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,fixAvailable:v.fixAvailable}));
            }
          }
          NODE

      - name: Verify formatting
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Commit safe dependency updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: apply safe npm audit fixes"
          git push origin HEAD:main
